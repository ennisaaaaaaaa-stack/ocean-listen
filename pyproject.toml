[project]
name = "whale-listen"
version = "0.1.0"
description = "Ears for AI — convert audio to structured note data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "basic-pitch>=0.3.0",
    "onnxruntime>=1.16.0",
    "pretty-midi>=0.2.10",
    "scipy>=1.10.0",
    "librosa>=0.10.0",
]

[project.scripts]
whale-listen = "whale_listen:main"
